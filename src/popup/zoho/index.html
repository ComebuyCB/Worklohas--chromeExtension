<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="/static/plugins/jquery-3.6.4/jquery.min.js"></script>
  <link href="/static/plugins/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/plugins/fontawesome-free-7.2.0-web/css/all.min.css" rel="stylesheet">
  <link href="main.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex justify-content-between align-items-center gap-2 mb-2">

    <span class="zoho_msg js-msg" role="status"></span>
  </div>
  <div class="d-flex gap-2">

    <button class="btn btn-outline-secondary btn-sm flex-shrink-0 js-btn-shortcut" type="button"><i class="fas fa-keyboard me-1"></i>編輯快捷鍵 <span class="js-shortcut"></span></button>

  <script src="main.js"></script>
